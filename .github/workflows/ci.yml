name: CI

on:
  push:
    branches:
      - development
      - master
  pull_request:
    branches:
      - development
      - master

jobs:
  tests:
    name: PHP ${{ matrix.php }} - L${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['11.*', '12.*']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, sqlite3, pdo_sqlite, json
          coverage: none

      - name: Install Dependencies
        run: |
          if [ "${{ matrix.laravel }}" = "11.*" ]; then
            composer require "orchestra/testbench:^9.0" "illuminate/support:11.*" "illuminate/database:11.*" "illuminate/console:11.*" --no-interaction --no-update
          else
            composer require "orchestra/testbench:^10.0" "illuminate/support:12.*" "illuminate/database:12.*" "illuminate/console:12.*" --no-interaction --no-update
          fi
          composer update --prefer-stable --prefer-dist --no-interaction

      - name: Validate Composer
        run: composer validate --strict --no-check-lock

      - name: Security Audit
        run: composer audit

      - name: Execute Tests
        run: vendor/bin/phpunit

  mysql-integration:
    name: MySQL Integration
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: lifecycle_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_mysql, json
          coverage: none

      - name: Install Dependencies
        run: composer update --prefer-dist --no-interaction

      - name: Create Isolated Source Database
        run: mysql -h 127.0.0.1 -u root -proot -e "CREATE DATABASE IF NOT EXISTS lifecycle_source_test;"

      - name: Execute Tests
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: lifecycle_test
          DB_SOURCE_DATABASE: lifecycle_source_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: vendor/bin/phpunit

  mariadb-integration:
    name: MariaDB Integration
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: lifecycle_test
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_mysql, json
          coverage: none

      - name: Install Dependencies
        run: composer update --prefer-dist --no-interaction

      - name: Create Isolated Source Database
        run: mysql -h 127.0.0.1 -u root -proot -e "CREATE DATABASE IF NOT EXISTS lifecycle_source_test;"

      - name: Execute Tests
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: lifecycle_test
          DB_SOURCE_DATABASE: lifecycle_source_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: vendor/bin/phpunit

  postgres-integration:
    name: PostgreSQL Integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: lifecycle_test
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3 -c max_connections=300

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_pgsql, json
          coverage: none

      - name: Install Dependencies
        run: composer update --prefer-dist --no-interaction

      - name: Create Isolated Source Database
        run: PGPASSWORD=secret psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE lifecycle_source_test;" || true

      - name: Execute Tests
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: lifecycle_test
          DB_SOURCE_DATABASE: lifecycle_source_test
          DB_USERNAME: postgres
          DB_PASSWORD: secret
        run: vendor/bin/phpunit

  code-quality:
    name: Code Quality (Pint & PHPStan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, sqlite3, pdo_sqlite, json
          coverage: none

      - name: Install Dependencies
        run: composer update --prefer-dist --no-interaction

      - name: Run Pint (Code Formatting)
        run: vendor/bin/pint --test

      - name: Run PHPStan (Static Analysis)
        run: vendor/bin/phpstan analyse

      - name: Composer Security Audit
        run: composer audit
